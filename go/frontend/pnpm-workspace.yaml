# pnpm 11 は package.json の "pnpm" フィールドを読まないため、設定はすべてここに置く。
# https://pnpm.io/settings

# 公開から7日未満のパッケージを取得しない。サプライチェーン攻撃の版は公開1〜7日以内に
# 検知・削除されることが多いため。
minimumReleaseAge: 10080 # 60 * 24 * 7 = 7日（分）
minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.32
  - browserslist@4.29.4
  - caniuse-lite@1.0.30001819
  - electron-to-chromium@1.5.464
  - ignore@7.0.14
  - node-releases@2.0.60
  - tldts-core@7.4.19
  - tldts@7.4.19
  - typescript-eslint@8.72.0
  - '@asamuzakjp/css-color@7.1.9'
  - '@asamuzakjp/dom-selector@10.0.5'
  - '@babel/core@8.0.9'
  - '@babel/helper-string-parser@7.29.11'
  - '@babel/helper-string-parser@8.0.8'
  - '@babel/helpers@8.0.8'
  - '@babel/parser@7.29.11'
  - '@babel/parser@8.0.8'
  - '@babel/types@7.29.11'
  - '@babel/types@8.0.8'
  - '@typescript-eslint/eslint-plugin@8.72.0'
  - '@typescript-eslint/parser@8.72.0'
  - '@typescript-eslint/project-service@8.72.0'
  - '@typescript-eslint/scope-manager@8.72.0'
  - '@typescript-eslint/tsconfig-utils@8.72.0'
  - '@typescript-eslint/type-utils@8.72.0'
  - '@typescript-eslint/types@8.72.0'
  - '@typescript-eslint/typescript-estree@8.72.0'
  - '@typescript-eslint/utils@8.72.0'
  - '@typescript-eslint/visitor-keys@8.72.0'
  - minimatch@11.0.3
  - '@isaacs/nonrecursive-glob-match@1.0.3'

# 先に公開された版より trusted publisher や provenance の信頼の段階が下がった版を拒否する。
trustPolicy: no-downgrade

overrides:
  vite: "npm:@voidzero-dev/vite-plus-core@1.3.0"
  vitest: "5.0.5"
  ws: "^8.20.1"
  undici: "^7.29.1"
  js-yaml: ">=4.3.0 <5.0.0 || >=5.4.1"
  "@babel/core": ">=7.29.6"
  picomatch: ">=4.0.4"
  postcss: "8.5.23"
  nanoid: "3.3.18"
  source-map-js: "1.2.2"
  tinypool: "2.2.0"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  'minimatch@>=10.0.0 <11.0.1': ^11.0.3
peerDependencyRules:
  allowedVersions:
    vite: "1"
