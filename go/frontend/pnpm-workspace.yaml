# pnpm 11 は package.json の "pnpm" フィールドを読まないため、設定はすべてここに置く。
# https://pnpm.io/settings

# 公開から7日未満のパッケージを取得しない。サプライチェーン攻撃の版は公開1〜7日以内に
# 検知・削除されることが多いため。
minimumReleaseAge: 10080 # 60 * 24 * 7 = 7日（分）

# 先に公開された版より trusted publisher や provenance の信頼の段階が下がった版を拒否する。
trustPolicy: no-downgrade

overrides:
  vite: "npm:@voidzero-dev/vite-plus-core@1.3.0"
  vitest: "5.0.5"
  ws: "^8.20.1"
  undici: "^7.29.1"
  js-yaml: ">=4.3.0 <5.0.0 || >=5.4.1"
  "@babel/core": ">=7.29.6"
  picomatch: ">=4.0.4"
  postcss: "8.5.23"
  nanoid: "3.3.18"
  source-map-js: "1.2.2"
  tinypool: "2.2.0"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
peerDependencyRules:
  allowedVersions:
    vite: "1"
