# pnpm の設定はすべてここに置く。pnpm 11 から package.json の "pnpm" フィールドは
# 読まれなくなり、.npmrc も認証・レジストリ設定専用になったため。
# https://pnpm.io/settings

# --- 依存の上書き ---
# vite / vitest は下の catalog の版（Vite+ が同梱する版）にそろえる。
# 依存がほかの版の vitest を入れると、mock や expect が2組に分かれるため。
# https://viteplus.dev/guide/migrate
# それ以外は脆弱性のあるバージョンを踏まないための下限固定。
# 範囲指定 (">=5.0.9" など) だと解決版が揺れて脆弱版が残るため、必ず具体バージョンで書く。
overrides:
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=3.0.0 <5.0.12": "5.0.12"
  "undici@>=7.0.0 <7.29.0": "^7.29.0"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "@babel/core@<7.29.6": "^7.29.6"
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
  "postcss@<8.5.23": "8.5.23"
  "nanoid@<3.3.17": "^3.3.17"
  "tinypool@<2.1.2": "2.1.2"
  "source-map-js@<1.2.2": "1.2.2"
  vite@*: "catalog:"
  vitest@*: "catalog:"

# vite を Vite+ に差し替えている都合で、vite の peer を要求するパッケージからは
# バージョンが vite-plus-core の版（1.0.0）に見える。strictPeerDependencies を有効にしたままにするため、
# このバージョンを明示的に許可する。
peerDependencyRules:
  allowedVersions:
    vite: "1.0.0"

# --- サプライチェーン対策 ---
# 公開から7日未満のパッケージを取得しない。chalk/debug (2024)、lottie-player (2024)、
# eslint-config-* (2024) のようなサプライチェーン攻撃は公開1〜7日以内に検知・削除
# されることが多く、1週間待つだけで大半を回避できる。
# 緊急のホットフィックスが必要なときは --minimum-release-age 0 で個別に上書きするが、
# それは意図的にレビューされた例外として扱う。
minimumReleaseAge: 10080 # 60 * 24 * 7 = 7日（分）

# package.json の依存はすべて完全一致で固定しているので、^ や ~ が再混入する
# 保存を抑止する。
saveExact: true
savePrefix: ""

# peer 依存の不一致は警告ではなくビルド失敗にして、非互換な依存ツリーへ静かに
# 流されないようにする。
strictPeerDependencies: true

# install 時に監査を走らせ、到達可能なアドバイザリを即座に表面化させる。
audit:
  level: moderate

# 整合性ハッシュが lockfile と一致しなければ install を失敗させる（既定だが明示）。
verifyStoreIntegrity: true

# --- Vite+ の版 ---
# vite-plus を上げるときは3つをそろえ、peerDependencyRules の vite も同じ版にする。
# vitest の版は `vp toolchain vitest` が示す同梱の版にする。
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
