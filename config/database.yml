default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USER") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>

development:
  <<: *default
  database: big_tree_table_development

test:
  <<: *default
  database: big_tree_table_test

production:
  primary: &primary_production
    <<: *default
    database: big_tree_table_production
    username: big_tree_table
    password: <%= ENV["BIG_TREE_TABLE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: big_tree_table_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: big_tree_table_production_queue
    migrations_paths: db/queue_migrate
