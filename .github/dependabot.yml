version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Same 7-day release-age wait as frontend's pnpm minimumReleaseAge.
  # Security updates are not affected (cooldown applies to version updates only).
  cooldown:
    default-days: 7
  # One grouped PR per week: concurrent bundler PRs conflict on adjacent
  # Gemfile.lock CHECKSUMS lines, and hand-resolving that conflict is how
  # stale CHECKSUMS reached main (PR #44/#52/#56).
  groups:
    bundler:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # pnpm rejects versions newer than 7 days (minimumReleaseAge), so propose only those.
  cooldown:
    default-days: 7
  groups:
    npm:
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
        - "*"
