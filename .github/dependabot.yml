version: 2
updates:
- package-ecosystem: bundler
  directory: "/rails"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Same 7-day release-age wait as frontend's pnpm minimumReleaseAge.
  # Security updates are not affected (cooldown applies to version updates only).
  cooldown:
    default-days: 7
  # One grouped PR per week: concurrent bundler PRs conflict on adjacent
  # Gemfile.lock CHECKSUMS lines, and hand-resolving that conflict is how
  # stale CHECKSUMS reached main (PR #44/#52/#56).
  groups:
    bundler:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/rails/frontend"
  schedule:
    # A locked version younger than the cooldown fails the whole pnpm update; retry daily so updates resume as soon as it ages.
    interval: daily
  open-pull-requests-limit: 10
  # pnpm installs only versions at least 7 days old (minimumReleaseAge); cooldown keeps version-update PRs within that.
  cooldown:
    default-days: 7
  # typescript-eslint 8.71 requires typescript <6.1.0; TypeScript 7 breaks lint.
  # Remove when typescript-eslint's peerDependencies allow the next TypeScript.
  ignore:
    - dependency-name: typescript
      versions: [">=6.1.0"]
    # vite-plus, vite (the vite-plus-core alias) and vitest must move together, but
    # Dependabot bumps them one at a time. Update them by hand with `pnpm exec vp migrate`.
    # Security alerts still arrive; ignore only affects Dependabot pull requests.
    # https://viteplus.dev/guide/upgrade-project
    - dependency-name: vite-plus
    - dependency-name: vite
    - dependency-name: vitest
  groups:
    npm:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/go/frontend"
  schedule:
    # A locked version younger than the cooldown fails the whole pnpm update; retry daily so updates resume as soon as it ages.
    interval: daily
  open-pull-requests-limit: 10
  # pnpm installs only versions at least 7 days old (minimumReleaseAge); cooldown keeps version-update PRs within that.
  cooldown:
    default-days: 7
  # typescript-eslint 8.71 requires typescript <6.1.0; TypeScript 7 breaks lint.
  # Remove when typescript-eslint's peerDependencies allow the next TypeScript.
  ignore:
    - dependency-name: typescript
      versions: [">=6.1.0"]
    # vite-plus, vite (the vite-plus-core alias) and vitest must move together, but
    # Dependabot bumps them one at a time. Update them by hand with `pnpm exec vp migrate`.
    # Security alerts still arrive; ignore only affects Dependabot pull requests.
    # https://viteplus.dev/guide/upgrade-project
    - dependency-name: vite-plus
    - dependency-name: vite
    - dependency-name: vitest
  groups:
    go-frontend-npm:
      patterns:
        - "*"
- package-ecosystem: gomod
  directory: "/go/backend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  groups:
    gomod:
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
        - "*"
