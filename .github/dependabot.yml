version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Same 7-day release-age wait as frontend's pnpm minimumReleaseAge.
  # Security updates are not affected (cooldown applies to version updates only).
  cooldown:
    default-days: 7
  # One grouped PR per week: concurrent bundler PRs conflict on adjacent
  # Gemfile.lock CHECKSUMS lines, and hand-resolving that conflict is how
  # stale CHECKSUMS reached main (PR #44/#52/#56).
  groups:
    bundler:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # pnpm installs only versions at least 7 days old (minimumReleaseAge); cooldown keeps version-update PRs within that.
  cooldown:
    default-days: 7
  # typescript-eslint 8.71 requires typescript <6.1.0; TypeScript 7 breaks lint.
  # Remove when typescript-eslint's peerDependencies allow the next TypeScript.
  ignore:
    - dependency-name: typescript
      versions: [">=6.1.0"]
    # vite (the vite-plus-core alias) and vitest follow the vite-plus version and must
    # move with it; bumping one alone fails peer resolution. Dependabot proposes only
    # vite-plus; run `pnpm exec vp migrate` on that PR. scripts/check-dependency-policy.mjs
    # fails lint until the versions match and the pnpm policy is intact.
    # https://viteplus.dev/guide/upgrade-project
    - dependency-name: vite
    - dependency-name: vitest
  groups:
    npm:
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
        - "*"
