name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # gitleaks auto-detects .gitleaks.toml at the repo root; the reusable
    # workflow provides GITHUB_TOKEN (required for pull_request scans).
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  # Gemfile.lock self-consistency guard (lockfile job only; lint/scan/tests
  # stay in the repo-specific quality job below). Stale CHECKSUMS come from
  # resolving a Dependabot PR's Gemfile.lock conflict in the web editor (main's
  # old CHECKSUMS block survives while the GEM section moves on), which then
  # breaks frozen `bundle install` (exit 16). git never recomputes CHECKSUMS,
  # so on a Dependabot PR the job comments `@dependabot recreate` instead of
  # asking for a manual fix; that needs pull-requests: write.
  lockfile:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/rails-ci.yml@v1
    with:
      run-lint: false
      security-scan: false
      run-tests: false
      dependabot-recreate: true

  # Kept as a repo-specific job (not replaced by rails-ci.yml@v1):
  # the reusable test-mysql job runs MySQL with MYSQL_ALLOW_EMPTY_PASSWORD
  # and sets only DB_HOST, while this repo's config/database.yml defaults
  # DB_PASSWORD to "password". workflow_call also gives no way to inject
  # RAILS_ENV/DB_* env, Node 24 (needed by bin/quality's build step), or the
  # MySQL client libraries — and bin/quality already bundles rubocop/brakeman/
  # audit, which rails-ci.yml would run a second time in separate jobs.
  quality:
    name: rubocop · sorbet · brakeman · audit · tests · build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: big_tree_table_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      CI: "true"

    steps:
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y default-libmysqlclient-dev default-mysql-client

      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true     # cache + install gems

      - name: Set up Node (for assets:precompile sanity)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "mysql up"; exit 0
            fi
            sleep 2
          done
          echo "mysql never came up"; exit 1

      - name: Prepare database
        run: bin/rails db:create db:schema:load

      - name: Run unified quality gate (rubocop · srb tc · brakeman · audit · tests · build)
        run: bin/quality

  frontend:
    name: frontend (typecheck · lint · vitest)
    uses: okamyuji/reusable-workflows/.github/workflows/node-ci.yml@v1
    with:
      node-version: "24"
      working-directory: frontend
      lint-command: run lint
      typecheck-command: run typecheck
      test-command: run test
