# TLS ends here: the browser sends Basic auth credentials on every /api call.
# Rails' assume_ssl already marks each request as HTTPS, so no
# X-Forwarded-Proto is needed toward the backend.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mounted at run time (compose.production.yml); never baked into the image.
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the edge: overwrite (not append) so a client-sent value
        # cannot pick the IP that Rails' rate_limit counts against.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Client-IP "";
        # Rack reads Forwarded before X-Forwarded-For, so drop any client value.
        proxy_set_header Forwarded "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
