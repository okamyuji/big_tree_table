# Local development orchestration.
#
#   docker compose up -d            # mysql + backend + frontend
#   docker compose up -d mysql      # MySQL only (host-port 3306)
#   docker compose exec backend bin/rails db:create db:migrate db:seed
#
# Frontend Vite dev server is reachable at http://localhost:5173
# Rails API is reachable at http://localhost:3000
# MySQL is reachable at 127.0.0.1:3306 from the host (root/password)
services:
  mysql:
    image: mysql:8.0
    container_name: big_tree_table-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: big_tree_table_development
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: big_tree_table-backend
    environment:
      RAILS_ENV: development
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: password
      BIG_TREE_TABLE_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - .:/rails
      - bundle-cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: big_tree_table-frontend
    environment:
      # Vite proxies /api → backend service inside the compose network.
      VITE_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql-data:
  bundle-cache:
  node_modules:
